name: postsbymarko-dev

networks:
  beNetwork:
  feNetwork:
  
services:
  #DATABASE
  database:
    container_name: PostsByMarko.MariaDb
    image: mariadb:10.11
    environment: 
      MARIADB_DATABASE: postsbymarko
      MARIADB_USER: ${DB_USER:-postsbymarko}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    ports:
      - 127.0.0.1:${SQL_PORT:-3306}:3306
    networks:
      - beNetwork
    volumes:
      - development-database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
   
  #HOST
  host:
    container_name: PostsByMarko.Host
    build:
      context: .
      dockerfile: src/PostsByMarko.Host/Dockerfile
    ports:
      - 127.0.0.1:${HOST_PORT:-7171}:7171
    depends_on:
      database:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - beNetwork
      - feNetwork
    environment:
      - ASPNETCORE_URLS=http://+:7171
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=database;Port=3306;Database=postsbymarko;User=${DB_USER:-postsbymarko};Password=${DB_PASSWORD:?DB_PASSWORD must be set}
      - JwtConfig__Secret=${JWT_SECRET:?JWT_SECRET must be set}
      - JwtConfig__ValidIssuers__0=http://localhost:${HOST_PORT:-7171}
      - JwtConfig__ValidAudiences__0=http://localhost:${CLIENT_PORT:-3000}
      - ApplicationUrls__ApiBaseUrl=http://localhost:${HOST_PORT:-7171}
      - ApplicationUrls__ClientBaseUrl=http://localhost:${CLIENT_PORT:-3000}
      - EmailConfig__Enabled=true
      - EmailConfig__Host=mailpit
      - EmailConfig__Port=1025
      - EmailConfig__UseSsl=false
      - EmailConfig__Username=
      - EmailConfig__Password=
      - EmailConfig__SenderAddress=local@postsbymarko.test
      - DevelopmentAdmin__Email=${DEVELOPMENT_ADMIN_EMAIL:-}
      - DevelopmentAdmin__Password=${DEVELOPMENT_ADMIN_PASSWORD:-}
    volumes:
      - development-keys:/root/.aspnet/DataProtection-Keys

  #CLIENT
  client:
    container_name: PostsByMarko.Client
    build:
      context: .
      dockerfile: src/PostsByMarko.Client/Dockerfile
    ports:
      - 127.0.0.1:${CLIENT_PORT:-3000}:3000
    depends_on:
      - host
    networks:
      - feNetwork
    environment:
      - NODE_ENV=development
      - REACT_APP_API_BASE_URL=http://localhost:${HOST_PORT:-7171}


  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - beNetwork

volumes:
  development-database:
  development-keys:
